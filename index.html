`T|GQ KOREA · AUGUST 2026|김영훈의 서른,/여전히 새로운 얼굴|MODEL · KIM YOUNGHOON`,
`L|오래도록 카메라 앞에 서 온 남자. 익숙한 일상 속에서도 새로운 순간을 찾아내는 모델 김영훈과 나눈 이야기.`,
`P|서른의 김영훈은 여전히 카메라 앞에서 새롭다. 어떤 옷을 입느냐에 따라 전혀 다른 분위기를 만들어 내고, 단 한 장의 사진으로도 자신만의 인상을 남긴다. 업계에서 오랜 시간 활동해 온 유명 모델이지만, 그에게는 아직 보여주지 않은 얼굴이 많다.`,
`P|촬영 현장에서의 진지한 눈빛과 달리, 카메라가 꺼진 뒤의 김영훈은 제법 장난스럽다. 질문이 재미있으면 웃음을 터뜨리고, 생각보다 어려운 질문에는 잠깐 고민하다가 엉뚱한 대답을 내놓기도 한다. 자신의 일에 관해서는 분명한 기준을 가지고 있으면서도, 그걸 설명하는 방식은 무겁지 않게 던진다.`,
`P|이번 인터뷰에서는 모델 김영훈의 일과 취향, 그리고 서른을 맞이했던 그의 일상에 관해 물었다.`,
`H|INTERVIEW`,
`Q|오늘 촬영은 어땠나요? 사진 분위기가 꽤 차분하고 어두워요.`,
`A|좋았어요! 처음에 레퍼런스를 봤을 때부터 자신 있었는데, 더 노력했어요. 잘 나오고 싶어서요. (웃음)`,
`Q|촬영장 분위기가 아주 화기애애하고 웃음이 많던데, 촬영장에서 웃는 걸 참느라 힘들지 않나요?`,
`A|아니, 참는 건 잘해요. 근데 웃지 말라고 하면 더 웃고 싶어지는 거 있잖아요. 한 번 웃음 터지면 큰일 나요. 촬영장에서는 그래도 프로니까 잘 참았습니다.`,
`Q|네, 아주 프로페셔널했습니다. (웃음) 모델이라는 직업을 선택하게 된 계기가 궁금해요.`,
`A|처음부터 엄청난 목표가 있었던 건 아니에요. 근데, 주변의 권유도 있었고, 저도 새로운 경험을 해보고 싶었어요. 그렇게 발을 들인 게 벌써 십년이 다 되어가네요. 처음 카메라 앞에 섰을 때는 어색했는데, 사진으로 완성된 결과물을 보니까 재미있더라고요. 제가 평소에는 보여주지 않는 모습을 만들어 낼 수 있다는 게 매력적이었어요.`,
`Q|처음부터 카메라 앞에서 자연스러운 편이었나요?`,
`A|전혀요. 처음에는 어디를 봐야 하는지도 모르겠고, 손을 어떻게 해야 할지도 모르겠고. 사진 찍을 때 손이 제일 문제였어요. (웃음) 지금 생각하면 그때 사진은 조금 부끄러워요. 그래도 그 시절이 있었으니까 지금이 있는 거겠죠?`,
`Q|그렇다면 본인이 가장 좋아하는 촬영 스타일은 무엇인가요?`,
`A|의외로 힘을 많이 주지 않은 사진을 좋아해요. 자연스럽게 서 있거나, 무언가를 생각하는 순간을 포착한 사진이요. 너무 완벽하게 만들어진 모습보다 조금은 흐트러진 모습에서 매력이 느껴질 때가 있거든요. 제가 그런 순간을 찍어주는 것도 좋아해요.`,
`Q|본인 사진을 자주 확인하는 편인가요?`,
`A|네! 많이 봐요. 모니터링은 중요하니까요. (웃음) 마음에 드는 사진은 진짜 여러 번 봐요. 처음에는 괜찮네 싶다가도 나중에 다시 보면 아쉬운 부분이 보이기도 하고요. 반대로 시간이 지나도 계속 좋은 사진이 있어요. 누군가 그랬는데, 피사체에 애정이 담겨져있으면 사진이 정말 잘 나온대요. 그런 사진을 만나면 기분이 좋죠.`,
`I|1`,
`H|OFF THE CAMERA`,
`Q|일하지 않을 때의 김영훈은 어떤 사람인가요?`,
`A|음…… 집에 있는 것도 좋아하고, 밖에 나가는 것도 좋아해요. 집돌이일 거 같다는 말을 자주 듣는데, 의외로 잘 돌아다녀요. 러닝을 뛰거나, 혼자 카페에 가거나 하기도 해요.`,
`Q|평소 아침형 인간인가요, 야행성인가요?`,
`A|일정에 따라 달라요. 촬영 있으면 잘 일어나죠. 없으면…… 조금만 더 자고요. 진짜 조금만 더 자려고 했는데 눈 떠보면 시간이 많이 지나 있을 때가 있어요. 아, 이건 비밀로 해주세요. (웃음)`,
`Q|직업이 직업이다보니 자기 관리도 철저할 것 같은데요.`,
`A|관리해야죠. 직업이니까요. 그렇다고 매일 엄격하게 사는 건 아니에요. 먹고 싶은 것도 먹고, 컨디션이 안 좋은 날에는 무리하지 않으려고 해요. 꾸준히 관리하는 게 중요하지 하루 이틀 완벽하게 한다고 되는 것도 아니더라고요.`,
`Q|식단 관리 중에도 꼭 포기하지 못하는 음식이 있나요?`,
`A|너무 많은데요? (웃음) 맛있는 건 다 좋아해요. 한때 한창 빠졌던 식당이 있는데, ‘영천영화’라고 고깃집이 있어요. 거기서 소고기를 한 번 먹고 너무 충격을 먹었어요. 같이 갔던 사람이 제가 고기를 씹자마자 완전히 넋이 나간 얼굴을 보고 되게 웃었던 기억이 있는데, 그만큼이나 맛있어요. 에디터님도 한 번 가보세요.`,
`Q|그정도라고요? (웃음) 꼭 가봐야겠어요. 그럼, 영훈 씨는 스트레스가 쌓이면 어떻게 푸나요?`,
`A|일단 맛있는 거 먹고요. 산책도 하고, 음악도 들어요. 친구들이랑 만나서 별것 아닌 이야기 하면서 웃는 것도 좋아해요. 스트레스를 받았다고 꼭 대단한 걸 해야 하는 건 아닌 것 같아요. 기분이 조금 나아지는 일을 하면 되죠.`,
`Q|친구들 사이에서는 어떤 편인가요?`,
`A|저요? 저는 제가 재밌는 편이라고 생각해요 (웃음) 사실, 재미보다는 제가 말실수를 자주 하고 엉뚱한 소리를 뱉을 때가 있는데, 그게 그렇게 웃기다고 하더라고요. 친구들에게 놀림을 좀 받는 편인 거 같긴해요.`,
`X|2,3`,
`H|A LITTLE ABOUT LOVE`,
`Q|일과 일상에 관해 많이 이야기했는데, 조금 다른 질문을 해볼게요. 영훈 씨에게 행복이란 어떤 건가요?`,
`A|거창한 건 아닌 것 같아요. 맛있는 걸 먹었을 때도 행복하고, 사랑하는 사람을 만났을 때도 행복하고. 좋아하는 일을 하면서 좋은 결과를 얻었을 때도 그렇고요. 결국 제가 좋아하는 것들을 제 곁에 두고 살아가는 게 행복 아닐까요?`,
`Q|오, 방금 사랑하는 사람과 함께 있는 것이라고 하셨는데, 영훈 씨에게도 그런 사람이 있나요?`,
`A|(웃음) 노코멘트 해도 되나요? 누구나 그렇듯 좋아하는 사람과 함께할 수 있는 건 행복한 일이죠. 그래서 전 늘 행복한가 봐요.`,
`Q|어라, 이거 대답이 된 건가요?`,
`A|하하. 글쎄요? 어떻게 받아들이시느냐에 따라 다르지 않을까요? (웃음) 아무튼 저는 요즘 행복합니다.`,
`Q|마지막으로, 앞으로의 김영훈은 어떤 모습이길 바라나요?`,
`A|지금처럼 제가 좋아하는 일을 오래 하고 싶어요. 새로운 도전도 계속하고 싶고요. 나이를 먹으면서 예전에는 몰랐던 것들을 더 많이 알게 되잖아요. 앞으로는 어떤 모습으로 일하게 될지, 어떤 새로운 경험을 하게 될지 저도 궁금해요.`,
`B|그리고 무엇보다 지금 제 곁에 있는 것들을 소중하게 여기면서 살고 싶어요. 일이든 사람이든, 익숙해졌다고 해서 당연하게 생각하지 않는 사람이요. 그러면 꽤 괜찮은 어른이 되지 않을까요?`,
`Q|서른의 김영훈에게 한마디를 남긴다면요?`,
`A|잘하고 있다! (웃음) 너무 조급해하지 말고, 하고 싶은 거 하면서 재미있게 살자.`,
`P|그는 마지막 말을 마치고 웃었다. 인터뷰 내내 종종 장난스러운 대답으로 분위기를 풀어주던 사람다운 마무리였다.`,
`I|4`,
`H|GQ KOREA · THE LAST WORD`,
`P|카메라 앞에서의 김영훈은 정교하게 완성된 한 장의 사진과 같다. 그러나 그 사진 밖에는 우리가 미처 알지 못했던 모습들이 있다. 촬영이 잘 끝나면 기뻐하고, 가까운 사람들 앞에서는 장난을 치며 웃는 사람.`,
`P|그에게 서른은 모든 것을 완성해야 하는 나이가 아니라, 여전히 새로운 것을 알아가고 좋아할 수 있는 나이인 듯했다.`,
`P|인터뷰의 마지막, 행복에 관한 질문에 그가 내놓은 대답은 간단했다.`,
`W|좋아하는 것들을 제 곁에 두고 살아가는 게 행복이라고.`,
`P|그 말을 하는 그의 표정에는 특별한 설명도, 거창한 수식어도 필요하지 않았다. 어쩌면 김영훈이 생각하는 행복은 정말 그런 것인지도 모르겠다.`,
`P|서른의 김영훈은 여전히 새로운 얼굴을 보여주고 있다. 우리가 아직 모르는 그 얼굴까지도, 어쩌면 앞으로의 그의 이야기를 기대하게 만드는 이유일 것이다.`];
function gqBody(){const im=(n,c)=>`<div class="gimg ${c||''}"><span>IMAGE ${n+1}</span><img src="${GQI[n]}" alt="" onerror="this.remove()"></div>`;
 let o=`<div class="nav"><span>MENU</span><span class="logo"><b>GQ</b><small>KOREA</small></span><span>SEARCH</span></div>`+im(0)+'<div class="gw">';
 GQ.forEach(r=>{const i=r.indexOf('|'),k=r.slice(0,i),t=r.slice(i+1);
  if(k==='T'){const[a,b,c]=t.split('|');o+=`<div class="gk">${a}</div><h2 class="gt">${b.split('/').map(E).join('<br>')}</h2><div class="gm">${c}</div>`}
  else if(k==='L')o+=`<p class="gl">${E(t)}</p>`;
  else if(k==='P')o+=`<p class="gp">${E(t)}</p>`;
  else if(k==='H')o+=`<div class="gh">${E(t)}</div>`;
  else if(k==='Q')o+=`<p class="gqq">Q. ${E(t)}</p>`;
  else if(k==='A')o+=`<p class="gqa"><b>김영훈</b>${E(t)}</p>`;
  else if(k==='B')o+=`<p class="gqa">${E(t)}</p>`;
  else if(k==='W')o+=`<p class="gend">“${E(t)}”</p>`;
  else if(k==='I')o+=`</div>${im(+t)}<div class="gw">`;
  else if(k==='X'){const[a,b]=t.split(',');o+=`</div><div class="gx">${im(+a,'g1')}${im(+b,'g2')}</div><div class="gw">`}});
 return o+`<div class="gfoot">GQ KOREA · AUGUST 2026</div></div>`}
function gqView(s){if(s.web==='nv'||s.web==='nvload')return nvView(s);const top=`<div class="gbar"><span>Aa</span><span>🔒 gqkorea.co.kr</span><span>⟳</span></div>`,
 tool=`<div class="gtool"><button data-a="gqx" style="font-size:30px;line-height:22px;color:#007aff">‹</button><span>›</span><span>⇪</span><span>▯</span><span>❐</span></div>`;

 return `<div class="page" style="background:#fff">${top}<div class="body gq">${gqBody()}</div>${tool}</div>`}

 GT=`<div class="gtool"><button data-a="gqx" style="font-size:30px;line-height:22px;color:#007aff">‹</button><span>›</span><span>⇪</span><span>▯</span><span>❐</span></div>`,

 if(art)return `<div class="page" style="background:#fff">${top}<div class="body nv"><div class="nvnh"><span class="nvlogo">N</span>NEWS</div><div class="nva"><div class="nvpr"><span>OSHOW 뉴스</span><button>+ 구독</button></div><h2>모델 김영훈, 글로벌 패션계 눈부신 활약</h2><small>기사입력 2026.08.05. 오전 10:21</small><div class="nvbd">${nvimg(0,'nvph')}<p>모델 김영훈(30)이 국내를 넘어 글로벌 패션계에서 활동 영역을 넓혀가고 있다. 다양한 패션 화보와 브랜드 작업에 참여하며 모델로서의 경력을 쌓아 온 그는 특유의 분위기와 폭넓은 콘셉트 소화력을 바탕으로 꾸준히 활동을 이어가고 있다.</p><p>김영훈은 클래식한 스타일링부터 실험적인 패션 콘셉트까지 다양한 작업을 소화하며 자신만의 포트폴리오를 구축해 왔다. 촬영마다 콘셉트에 맞춰 서로 다른 이미지를 선보이며 패션 모델로서의 표현 영역을 넓히고 있다.</p><p>김영훈은 그간의 경험을 바탕으로 새로운 작업과 도전을 이어갈 예정이다. 국내외 패션 무대에서 활동을 지속하고 있는 그가 앞으로 어떤 행보를 보여줄지 관심이 모인다.</p></div></div><div class="nvcms"><div class="nvch">댓글 <b>5</b></div>${CMT.map(c=>nvcm(c)).join('')}</div></div>${GT}</div>`;
 return `<div class="page" style="background:#fff">${top}<div class="body nv" style="background:#f2f4f6"><div style="background:#fff"><div class="nvh"><span class="nvlogo">N</span><div class="nvs"><span style="flex:1">김영훈</span><i>✕</i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#03c75a" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></div></div><div class="nvt">${['통합','VIEW','이미지','지식iN','인플루언서','동영상','쇼핑','뉴스'].map((t,i)=>`<span class="${i?'':'on'}">${t}</span>`).join('')}</div></div>
 <div class="nvc"><div class="nvpt"><b>김영훈</b><span>모델</span></div><div class="nvp"><div class="nvpf"><span>🧑🏻</span><img src="IMG_0191.jpeg" alt="" onerror="this.remove()"></div><dl><dt>출생</dt><dd>1997.08.08. 인천광역시</dd><dt>소속사</dt><dd>MBB</dd><dt>활동</dt><dd><button class="nvb2" data-a="nvig">Instagram</button><span class="nvb2 off">YouTube</span></dd></dl></div></div>
 <div class="nvc"><div class="nvsrc"><span class="nvfav">나</span>나무위키 · namu.wiki</div><div class="nvtl">김영훈 - 나무위키</div><p>대한민국의 모델.</p></div>

function nFocus(j){const e=document.querySelector('.ned[data-j="'+j+'"]');if(e){e.focus();const r=document.createRange();r.selectNodeContents(e);r.collapse(false);const g=getSelection();g.removeAllRanges();g.addRange(r)}}
ph.addEventListener('input',e=>{const t=e.target,c=t.classList;if(!c||S.app!=='notes')return;if(c.contains('ned'))NOTES[S.s.i].items[+t.dataset.j].t=t.textContent;else if(c.contains('ntt'))NOTES[S.s.i].t=t.textContent});
ph.addEventListener('keydown',e=>{const t=e.target,c=t.classList;if(!c||S.app!=='notes')return;const n=NOTES[S.s.i];
 if(c.contains('ntt')&&e.key==='Enter'){e.preventDefault();nFocus(0)}
 else if(c.contains('ned')){const j=+t.dataset.j;
  if(e.key==='Enter'){e.preventDefault();n.items.splice(j+1,0,{c:0,t:''});drawApp();nFocus(j+1)}
  else if(e.key==='Backspace'&&!t.textContent&&n.items.length>1){e.preventDefault();n.items.splice(j,1);drawApp();nFocus(Math.max(0,j-1))}}});
/* ===== 지도 시트: 아래로 스크롤/드래그 → 내려가서 지도 노출, 위로 → 다시 올라옴 ===== */
let shy=null;
function mapSheet(dn){const m=$('.sheetm');if(!m)return;S.s.shd=dn;m.classList.toggle('dn',dn)}
ph.addEventListener('pointerdown',e=>{shy=e.target.closest('.sheetm')?e.clientY:null});
addEventListener('pointerup',e=>{if(shy==null)return;const dy=e.clientY-shy;shy=null;if(Math.abs(dy)>25)mapSheet(dy>0)});
ph.addEventListener('wheel',e=>{if(e.target.closest('.sheetm')&&Math.abs(e.deltaY)>4)mapSheet(e.deltaY>0)},{passive:true});
status();renderLock();show('lock');
